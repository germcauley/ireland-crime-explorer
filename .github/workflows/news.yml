name: Refresh recent reporting

# Daily. Nothing here is time-critical: the crime data updates quarterly and
# the section is framed as recent reporting, not breaking news. Each run
# commits the artifact, and that commit is what triggers the Vercel deploy.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch feeds
        run: python3 scripts/fetch_news.py

      - name: Classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/classify_news.py

      # Runs before the commit, so a bad classifier run fails the job rather
      # than reaching the site. The bar is precision: a wrongly placed article
      # is a false statement about a real place.
      - name: Validate
        run: python3 scripts/validate_news.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/news.json data/processed/news_raw.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Refresh recent reporting"
            git push
          fi
