name: Fetch news archive

# Fetch only — no API key, no secrets, no classification.
#
# Classification is done by hand in batches (see docs/recent-reporting-spec.md,
# "Running it"). This job's whole job is to keep the raw archive growing, so
# that when a batch is classified there is a backlog to classify rather than
# only whatever the feeds happen to expose that day. Most publisher feeds show
# 30-90 days, so without this the archive could never deepen past that.
#
# It never touches news.json, so it cannot change what the site displays.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch feeds
        run: python3 scripts/fetch_news.py

      - name: Report the review queue
        run: python3 scripts/classify_news.py --pending

      # Guards what is already published. The artifact is untouched by this
      # job, so a failure here means something else broke it.
      - name: Validate published artifact
        run: python3 scripts/validate_news.py

      - name: Commit the archive if it grew
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/news_raw.json
          if git diff --staged --quiet; then
            echo "no new articles"
          else
            git commit -m "Fetch news archive"
            git push
          fi
